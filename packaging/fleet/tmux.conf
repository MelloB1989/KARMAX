# The agent image's /etc/tmux.conf: a fixed window and no tmux commands from
# whoever holds the keyboard. Ctrl+] gives the keyboard back.
#
# `set -g window-size manual` as a config-file line crashes tmux 3.5a
# ("server exited unexpectedly" at the first window), so it is set by a hook
# once the first session exists. default-size is the size the window is born
# with; agent-run also passes -x 220 -y 50.
set -g default-size 220x50
set-hook -g after-new-session "set -g window-size manual"
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
bind-key -n C-] detach-client
set -g status off
set -g escape-time 0
