# The agent image's /etc/tmux.conf: a fixed window and no tmux commands from
# whoever holds the keyboard. Ctrl+] gives the keyboard back.
#
# window-size manual crashes tmux 3.5a ("server exited unexpectedly") for
# any window born under it: as a config-file line (the first window), and
# set globally (-g) by a hook, every later window — and each slot of an
# agent is a session with a window of its own. So it is set on each new
# session's window alone (-w), once that window exists — and the window is
# resized to the fixed size, since one born while a client is attached to
# another session takes that client's size. default-size is the size the
# first window is born with; agent-run also passes -x 220 -y 50.
set -g default-size 220x50
set-hook -g after-new-session "set -w window-size manual ; resize-window -x 220 -y 50"
set -g prefix None
set -g prefix2 None
unbind-key -a
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
bind-key -n C-] detach-client
set -g status off
set -g escape-time 0
