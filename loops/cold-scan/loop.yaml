name: cold-scan
version: 1.0.0
description: >
  Walks older WhatsApp chats the operator is no longer actively texting in and
  distils a durable per-chat summary into the chat-summary store the memory
  retrieval sub-agent reads.
schedule: "0 */45 * * * *"
memory_mb: 64

# It reads chats and messages and writes summaries. It sends nothing and has no
# network of its own.
host: [log, config, summarize, wa_chats, wa_messages, chat_summary_get, chat_summary_save]
capabilities:
  - tool:summarize
  - tool:whatsapp.read
  - memory:nexus
  - memory:nexus:write
