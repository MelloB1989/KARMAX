name: gchat-watch
version: 1.0.0
description: >
  Watches the operator's Google Chat spaces for pending items and acts, flags or
  reminds — the Google Chat counterpart to chat-sweep.
schedule: "0 0 */4 * * *"
memory_mb: 48

host: [log, config, hosttool, harness, notify, propose, remind, tool, short_set, short_all]

tools:
  - google_workspace

capabilities:
  - memory:nexus
  - memory:nexus:write
  - tool:harness
  - tool:app.push
  - tool:propose
  - tool:reminder.add
