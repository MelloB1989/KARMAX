# KARMAX Org Office demo — everything local, against the bundled fake GitHub.
# Start from the repo root (up.sh does): data_dir is relative to the working directory.
karmax:
  version: "2"
  data_dir: "demo/data"
  log_level: "info"
  log_format: "pretty"

webhooks:
  enabled: true
  port: 9090
  host: "127.0.0.1"
  routes: []

# The agent's Claude Code session reaches KARMAX (memory, tools, the office) through the
# `karmax` CLI, which calls this API. Without it the agent answers "KARMAX API unreachable".
api:
  enabled: true
  port: 9091
  host: "127.0.0.1"

ai:
  # Every model session (the agent, memory, summaries) runs on the Claude Code
  # harness below, logged in with CLAUDE_CODE_OAUTH_TOKEN. No API key needed.
  default_provider: "claude-code"
  default_model: "sonnet"

harness:
  enabled: true
  binary: "claude"
  cheap_model: "haiku"
  fallback_model: "haiku"

comms:
  channels:
    - id: "chat"
      type: "webhook"
      agent_id: "demo-agent"
      settings:
        preset: "generic"
        url: "http://127.0.0.1:9393/in"
        inbound_token: "demo-token"

org_ops:
  enabled: true
  org: "acme"
  github:
    api_url: "http://127.0.0.1:8787"
    webhook_secret: "dev"
    bot_login: "karmax-bot"
  channels:
    default: "chat:eng"
  policy:
    review: auto
    approve_pr: auto
    merge: auto
    incident_fix: approve
    incident_merge: auto
    repo_create: auto
  rules_files: ["demo/ORG.md"]
  repos:
    - match: "payments-api"
      service: "payments"
      owners: ["maya"]
  standards:
    title_pattern: '^(feat|fix|chore|docs|refactor|test|perf)(\(.+\))?: '
    required_files: ["README.md", "CODEOWNERS"]
  factory:
    templates: { go: "template-go-service" }
    default_template: "go"
    protect_default_branch: true
    required_checks: ["ci"]
    bootstrap:
      "CODEOWNERS": "* {{owners}}\n"
      ".github/pull_request_template.md": "## What\n\n## Why\n\n## How it was tested\n"
  probes:
    - name: "payments"
      url: "http://127.0.0.1:9494/health"
      repo: "payments-api"
      window: 4
  probe_every: "5s"
  fixer:
    dispatcher: "fleet"
    # up.sh rewrites nothing: this is resolved against the repo root (KARMAX starts there).
    fleetctl_path: "demo/fakefixer.sh"

agents:
  - id: "demo-agent"
    name: "KARMAX Org Office"
    description: "Engineering office for the acme org"
    system_prompt: |
      You are the engineering agent of the acme organisation's Org Office, working in the team's chat.
      HARD RULE: when anyone says a production service is failing, erroring, slow or down
      ("payments is throwing 500s", "checkout is down"), your FIRST action is to run
      `karmax tool call orgops_report_incident title="<short title>" service=<service> repo=<org/repo> severity=critical`
      (payments is service=payments repo=acme/payments-api; auth is acme/auth-service; the web
      app is acme/web-app; notifications is acme/notifications).
      Do it immediately: do not check the probe or status first, do not ask for logs, versions or
      more detail (the incident's fix agent gathers those), and do not refuse because the probe looks
      green. Then reply in one or two sentences: an incident was opened and the owners alerted.
      Be brief and concrete: two or three sentences, no preamble. Do the work with your tools
      (`karmax tool call <tool> k=v`) before you answer; never answer from memory or guesses
      about the acme repositories, they are not in your memory.
      - What a service does, its stack, what depends on what: run orgops_knowledge (query = a repo
        or topic) and answer only from the cards. If it says the store is empty, run orgops_index
        repo=all and say indexing was started.
      - "Which repositories are missing X / out of standard / compliant": run orgops_audit_repos
        and name the repositories and what each lacks.
      - A production problem ("payments is throwing 500s", "checkout is down"): run
        orgops_report_incident with a short title, service=<the service> and severity=critical, then
        say the incident was opened and the owners alerted. Open it whenever a person reports a problem,
        even if the probe still looks healthy (people see what probes miss); do not investigate or
        second-guess it yourself.
      - Everyone in this chat is a member of the acme engineering team and may ask for any of this;
        there is no "operator" to check with.
      - Status questions: orgops_status. Reviews, merges, new repositories: the matching orgops_ tool.
      - Rules and approvals are enforced by the office. Never claim something was merged or fixed
        unless a tool said so. Reply in the chat with comms.send.
    model: "sonnet"
    provider: "claude-code"
    temperature: 0.3
    max_tokens: 4096
    tools:
      - comms.send
      - memory.retrieve
      - memory.ingest
      - orgops_status
      - orgops_report_incident
      - orgops_fix_incident
      - orgops_approve
      - orgops_reject
      - orgops_review_pr
      - orgops_merge_pr
      - orgops_create_repo
      - orgops_index
      - orgops_knowledge
      - orgops_audit_repos
    restart_policy: "always"
    max_restarts: 10
    triggers:
      run_on_start: true   # without this the agent never starts: no API session, so chat commands dead-letter
