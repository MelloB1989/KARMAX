<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>#eng — KARMAX Org Office</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--bot:#1f2a3a;--me:#1d3b2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:12px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
header b{font-size:22px}header span{color:var(--dim);font-size:15px}
#feed{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card h4{margin:0 0 6px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.msg{margin:6px 0;padding:8px 12px;border-radius:8px;background:var(--bot);white-space:pre-wrap;word-wrap:break-word}
.msg.me{background:var(--me)}
.who{display:block;font-size:14px;font-weight:700;color:var(--acc)}.me .who{color:#56d364}
.t{color:var(--dim);font-weight:400;margin-left:8px}
code{font:16px ui-monospace,Menlo,Consolas,monospace;background:#0006;padding:1px 6px;border-radius:4px}
a{color:var(--acc)}
form{display:flex;gap:8px;padding:12px 24px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
input{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#user{width:120px}#text{flex:1;min-width:200px}
button{font:inherit;background:var(--acc);color:#04111f;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
#target{width:100%;font-size:15px;color:var(--dim)}#target a{cursor:pointer}
#err{width:100%;color:#ff7b72;font-size:15px}
</style></head><body>
<header><b>#eng</b><span>KARMAX Org Office · local chat — any webhook platform works the same</span></header>
<div id="feed"></div>
<form id="f">
<div id="target"></div><div id="err"></div>
<input id="user" value="Maya" aria-label="your name">
<input id="text" placeholder="Message #eng…" autocomplete="off" autofocus>
<button>Send</button>
</form>
<script>
const msgs=[],cards=new Map();let last=0,replyTo="",polling=false;
const feed=document.getElementById("feed");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
  const codes=[];
  s=esc(s).replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>{codes.push("<code>"+c+"</code>");return "\u0000"+(codes.length-1)+"\u0000"})
    .replace(/`([^`\n]+)`/g,(_,c)=>{codes.push("<code>"+c+"</code>");return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\*\*([^*\n]+)\*\*|\*([^*\n]+)\*/g,(_,a,b)=>"<b>"+(a||b)+"</b>")
     .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,]|$)/g,"$1<i>$2</i>")
     .replace(/\bhttps?:\/\/[^\s<)]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+"</a>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>codes[i]);
}
// KARMAX's generic webhook sends no thread id, so derive one from the text.
function key(m){
  if(m.thread)return m.thread;
  let x;
  if(x=m.text.match(/\bINC-[A-Z0-9]{5}\b/))return "incident "+x[0]; // "Fix for INC-AB2CD is up" too
  if(x=m.text.match(/incident\s+([A-Za-z0-9_-]*\d[A-Za-z0-9_-]*)/i))return "incident "+x[1];
  if(x=m.text.match(/\bPR\s*#?(\d+)|pull request\s*#?(\d+)|#(\d+)/i))return "PR #"+(x[1]||x[2]||x[3]);
  if(x=m.text.match(/\b(?:approve|reject)\s+([A-Z0-9]{5})\b/i)){
    const c=[...msgs].reverse().find(o=>o.text.includes(x[1]));if(c&&c!==m&&c.k)return c.k}
  return "general";
}
function add(m){
  m.k=key(m);msgs.push(m);
  let c=cards.get(m.k);
  if(!c){
    const el=document.createElement("div");el.className="card";if(m.thread)el.dataset.thread=m.thread;
    el.innerHTML="<h4></h4><div class=body></div>";el.querySelector("h4").textContent=m.k==="general"?"General":m.k;
    el.onclick=()=>setReply(m.k==="general"?"":m.k);
    feed.appendChild(el);c={el,body:el.querySelector(".body")};cards.set(m.k,c);
  }
  const d=document.createElement("div"),me=m.from!=="karmax";
  d.className="msg"+(me?" me":"");
  d.innerHTML='<span class=who>'+esc(m.from==="karmax"?"KARMAX":m.from)+'<span class=t>'+new Date(m.ts*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+"</span></span>"+md(m.text);
  c.body.appendChild(d);
  feed.appendChild(c.el); // most recently active thread goes to the bottom
  feed.scrollTop=feed.scrollHeight;
}
function setReply(k){
  replyTo=k;
  document.querySelectorAll(".card").forEach(e=>e.classList.remove("sel"));
  const c=cards.get(k||"general");if(k&&c)c.el.classList.add("sel");
  document.getElementById("target").innerHTML=k?'Replying in <b>'+esc(k)+'</b> · <a id=x>clear</a>':"";
  if(k)document.getElementById("x").onclick=e=>{e.stopPropagation();setReply("")};
  document.getElementById("text").focus();
}
const seen=new Set();
async function poll(){
  if(polling)return;polling=true;
  try{
    const r=await fetch("/messages?since="+last);
    for(const m of await r.json()){last=Math.max(last,m.id);if(!seen.has(m.id)){seen.add(m.id);add(m)}}
  }catch(e){}
  polling=false;
}
setInterval(poll,1000);
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  const t=document.getElementById("text"),err=document.getElementById("err");
  const text=t.value.trim();if(!text)return;
  // the server echoes the message into /messages; the poll shows it immediately
  const body={text,user:document.getElementById("user").value||"Maya"};
  const rc=cards.get(replyTo);if(rc&&rc.el.dataset.thread)body.thread=rc.el.dataset.thread;
  err.textContent="";t.value="";
  try{
    const r=await fetch("/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();if(!r.ok)err.textContent="⚠ "+(j.error||r.status);
  }catch(x){err.textContent="⚠ chat server unreachable: "+x}
  poll();
};
poll();
</script></body></html>
