<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KARMAX · Org Office</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="console.css">
</head><body>
<header id="top">
  <div class="brand"><span class="logo">K</span><b>KARMAX</b><span class="sep">·</span>Org Office<span class="sep">·</span><span class="org">acme</span></div>
  <div class="policy" id="policy"><span class="plabel">Autonomy policy</span><span id="chips"></span></div>
  <div class="clock" id="clock"></div>
</header>
<main>
  <section id="chat">
    <div class="ptitle"><span>#eng</span><small>any chat platform works the same</small></div>
    <div id="feed"></div>
    <form id="f">
      <div id="target"></div><div id="err"></div>
      <div class="row"><input id="user" value="Maya" aria-label="your name">
      <input id="text" placeholder="Message #eng…" autocomplete="off">
      <button>Send</button></div>
    </form>
  </section>
  <section id="live">
    <div class="panel" id="prod"><div class="ptitle"><span>Production</span><small>payments</small></div><div id="prodbody"></div></div>
    <div class="panel" id="inc"><div class="ptitle"><span>Incident</span><small id="incid"></small></div><div id="incbody"></div></div>
    <div class="panel" id="prs"><div class="ptitle"><span>Pull requests</span><small id="prcount"></small></div><div id="prbody" class="scroll"></div></div>
    <div class="panel" id="repos"><div class="ptitle"><span>Repositories</span><small>compliance</small></div><div id="repobody" class="scroll"></div></div>
    <div class="panel" id="know"><div class="ptitle"><span>Knowledge</span><small>org memory</small></div><div id="knowbody" class="scroll"></div></div>
  </section>
</main>
<div id="banner" hidden></div>
<aside id="drawer" aria-hidden="true"><div class="dhead"><div id="dtitle"></div><button id="dclose" aria-label="Close">×</button></div><div id="dbody"></div></aside>
<div id="scrim" hidden></div>
<div id="ctl" hidden>
  <div class="ctlhead">Presenter controls <small>press . to hide</small></div>
  <div class="ctlgrid" id="ctlgrid"></div>
</div>
<button id="ctlbtn" title="Presenter controls (.)">⋯</button>
<div id="toasts"></div>
<script src="console.js"></script>
</body></html>
